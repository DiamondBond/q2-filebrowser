name: Test
# Releases are built and published locally (README.md's Build), not here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go vet ./...
          go test ./...
          python3 contrib/shanlingq2/test_launcher.py
          contrib/shanlingq2/build.sh target/shanlingq2
